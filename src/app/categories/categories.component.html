<mat-card>
 @if (loading) {
  <app-loading-bar></app-loading-bar>
}

  <mat-card-header>
    <mat-card-title>Categorie</mat-card-title>
    <mat-card-subtitle>Lista delle categorie</mat-card-subtitle>
  </mat-card-header>
  @if(showForm) {
  <category-form
    (back)="hideCategoryForm()"
    (save)="onSave($event)"
    [category]="category"
  >
  </category-form>
  } @else {
  <mat-card-content>
    <table mat-table class="full-width-table" matSort aria-label="Elementi">
      <!-- Id Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <!-- Name Description -->

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let row">{{ row.description }}</td>
      </ng-container>

      <!-- Colonna Azioni -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
        <td mat-cell *matCellDef="let row">
          <button mat-button (click)="onEditCategoryClick(row)">  <mat-icon>edit</mat-icon></button>
          <button
            mat-icon-button
            color="warn"
            (click)="onDeleteCategoryClick(row)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      #Paginator
      [length]="dataSource.data.length"
      [pageIndex]="0"
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 20]"
      aria-label="Seleziona pagina"
    >
    </mat-paginator>
  </mat-card-content>
  }
  <mat-card-actions>
    <button mat-button (click)="onNewCategoryClick()">+ Nuova Categoria</button>
  </mat-card-actions>
  <mat-card-actions>
    <button type button mat-button color="primary" (click)="hideCategoryForm()">
      Indietro
    </button>
  </mat-card-actions>
</mat-card>
