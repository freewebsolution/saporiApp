<!-- src\app\categories\form\form.component.html -->
<mat-card-content>
  <form [formGroup]="categoryForm" novalidate>
    <div class="container">
      <mat-form-field class="item-30">
        <input matInput placeholder="Nome" formControlName="name" />
      </mat-form-field>
      <mat-form-field class="item-70">
        <input matInput placeholder="Descrizione" formControlName="description" />
      </mat-form-field>
    </div>
  </form>
</mat-card-content>
